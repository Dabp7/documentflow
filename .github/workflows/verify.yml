name: Verify DocumentFlow
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: demo
          POSTGRES_PASSWORD: demo
          POSTGRES_DB: documentflow
        ports: ['55432:5432']
        options: >-
          --health-cmd "pg_isready -U demo"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://demo:demo@localhost:55432/documentflow
      TEST_DATABASE_URL: postgres://demo:demo@localhost:55432/documentflow_test
      CHROMIUM_NO_SANDBOX: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npx playwright install --with-deps chromium
      - run: npm run db:migrate
      - run: npm run seed
      - run: npm run test:e2e
      - run: npm run demo:failure
