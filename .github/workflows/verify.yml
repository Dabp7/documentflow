name: Verify DocumentFlow
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: demo
          POSTGRES_PASSWORD: demo
          POSTGRES_DB: documentflow
        ports: ['55432:5432']
        options: >-
          --health-cmd "pg_isready -U demo"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://demo:demo@localhost:55432/documentflow
      TEST_DATABASE_URL: postgres://demo:demo@localhost:55432/documentflow_test
      CHROMIUM_NO_SANDBOX: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npx playwright install --with-deps chromium
      - run: npm run db:migrate
      - run: npm run seed
      - run: npm run test:e2e
      - run: npm run demo:failure
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build and start the delivered Compose demo
        run: docker compose up -d --build
      - name: Export ten documents through the container API and worker
        shell: bash
        run: |
          curl --retry 30 --retry-delay 2 --retry-connrefused --retry-all-errors -fsS http://127.0.0.1:4300/health
          curl -fsS http://127.0.0.1:4300/api/exports -H 'Content-Type: application/json' -H 'Idempotency-Key: container-ci' -d '{"from":"2026-01-01T00:00:00Z","until":"2026-01-01T00:11:00Z","kind":"all","format":"zip","render":"source"}' > /tmp/request.json
          id=$(jq -er '.id' /tmp/request.json)
          for attempt in $(seq 1 60); do
            state=$(curl -fsS "http://127.0.0.1:4300/api/exports/$id" | jq -r '.state')
            if [ "$state" = completed ]; then break; fi
            if [ "$state" = failed ]; then exit 1; fi
            sleep 2
          done
          test "$state" = completed
          curl -fsS "http://127.0.0.1:4300/api/exports/$id/download" -o /tmp/export.zip
          unzip -t /tmp/export.zip
          test "$(unzip -Z1 /tmp/export.zip | wc -l)" -eq 10
      - name: Container logs
        if: failure()
        run: docker compose logs --no-color
      - name: Remove the isolated CI containers and volumes
        if: always()
        run: docker compose down -v
